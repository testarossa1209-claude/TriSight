# トライサイト 関所（2026-10-15 作成／同日 改め：一行をやめて印だけ・理由を画面に出す）
# 本番（main）へ入れる申請ごとに動く。ここが1つでも通らないと Merge は押せない（ブランチの保護で必須にする）。
# 二の関所＝機械の点検　／　三の関所＝宏史さんの確認（印3つ。本文を最後に保存したのが宏史さんであること）
# 止まった理由・通ったことは、申請の画面の点検一覧に「関所の理由（…）」として日本語で出す。
# 2026-11-02 足した：機械の点検で、画面を実際に動かす試験（.github/tests）を走らせる。
# 2026-10-19 改め：知らせ（申請への書き込み＝宏史さんのメールに届く）は、止まったとき・点検できなかったときだけ出す。
#   通ったとき、および「三」の印がまだ付いていないだけ（確認待ち）のときは出さない。
# 2026-11-03 改め（宏史さん「コミットに時間がかかりすぎ」）：宏史さんの確認（hiroshi-kakunin）は別の決まり（sekisho_kakunin.yml）へ分けた。
#   本文の書き換え（印を付ける・なぎさが写しを足す）では、機械の点検をやり直さない。やり直すのは中身（プログラム）が変わったときだけ。
#   同じ申請で新しい中身が上がったら、古い中身の点検は途中で止める。
name: sekisho
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
concurrency:
  group: kikai-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write
jobs:
  machine:
    name: kikai-tenken
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 2026-11-02：動かす試験（.github/tests）のために、試し用のブラウザの操り手を入れる。ブラウザ本体は実行環境に入っている Chrome を使う
      - run: pip install --quiet playwright
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/sekisho_check.py machine
