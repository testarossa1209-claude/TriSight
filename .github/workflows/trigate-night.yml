# トライゲイト 自動発掘（PCの電源が切れていても動かす）
# 置き場所：.github/workflows/trigate-night.yml
# 1時間ごとに起き、登録の画面（TriNight.html）で選んだ時刻（日本時間）が来ていて、
# その日まだ動いていなければ、トライゲイトの自動発掘を最後まで走らせる。
# 会社の情報は保管庫に置いた「ダミー入りの写し」だけを使い、記録（ログ）には書き出さない。
# 2026-09-29
name: TriGate auto dig
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
concurrency:
  group: trigate-night
  cancel-in-progress: false
jobs:
  night:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: check
        id: check
        env:
          TRIGATE_CODE: ${{ secrets.TRIGATE_NIGHT_CODE }}
        run: |
          cat > check.cjs <<'EOF'
          const fs = require('fs');
          const CODE = process.env.TRIGATE_CODE || '';
          const log = (m) => console.log(new Date().toISOString().slice(0, 19) + ' ' + m);
          const out = (v) => fs.appendFileSync(process.env.GITHUB_OUTPUT, 'go=' + v + '\n');
          (async () => {
            if (!CODE) { log('secret TRIGATE_NIGHT_CODE is missing'); out('no'); process.exit(1); }
            let d = {};
            try {
              const r = await fetch('https://trisight-relay.vercel.app/api/box', { method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-trisight-code': CODE },
                body: JSON.stringify({ op: 'get' }) });
              if (!r.ok) { log('box refused ' + r.status); out('no'); process.exit(1); }
              const j = await r.json(); d = (j && j.data) || {};
            } catch (e) { log('box unreachable'); out('no'); process.exit(1); }
            if (!d.trisight_dig_company || !d.trisight_dig_company_name) { log('no company registered'); out('no'); return; }
            let hour = 3;
            try {
              const c = JSON.parse(d.trisight_dig_company);
              const m = c && (c['自動発掘用の写し'] || c['夜の発掘用の写し']);
              if (m && m['実行時刻'] != null && !isNaN(Number(m['実行時刻']))) hour = Number(m['実行時刻']);
            } catch (e) {}
            const now = Date.now();
            const j = new Date(now + 9 * 3600000);
            const todaySet = Date.UTC(j.getUTCFullYear(), j.getUTCMonth(), j.getUTCDate(), hour) - 9 * 3600000;
            let last = 0;
            try { const sv = JSON.parse(d.trisight_dig_saved || 'null'); last = Date.parse(sv && sv.nightAt) || 0; } catch (e) {}
            if (now < todaySet) { log('set hour ' + hour + ' JST not reached yet'); out('no'); return; }
            if (last >= todaySet) { log('already ran today'); out('no'); return; }
            log('time to run (set hour ' + hour + ' JST)'); out('yes');
          })();
          EOF
          node check.cjs
      - if: steps.check.outputs.go == 'yes'
        run: |
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
      - if: steps.check.outputs.go == 'yes'
        env:
          TRIGATE_CODE: ${{ secrets.TRIGATE_NIGHT_CODE }}
        run: |
          cat > night.mjs <<'EOF'
          import { chromium } from 'playwright';
          const CODE = process.env.TRIGATE_CODE || '';
          const log = (m) => console.log(new Date().toISOString().slice(0, 19) + ' ' + m);
          let comp = '', name = '';
          try {
            const r = await fetch('https://trisight-relay.vercel.app/api/box', { method: 'POST',
              headers: { 'Content-Type': 'application/json', 'x-trisight-code': CODE },
              body: JSON.stringify({ op: 'get' }) });
            if (!r.ok) { log('box refused ' + r.status); process.exit(1); }
            const j = await r.json();
            comp = (j && j.data && j.data.trisight_dig_company) || '';
            name = (j && j.data && j.data.trisight_dig_company_name) || '';
          } catch (e) { log('box unreachable'); process.exit(1); }
          if (!comp || !name) { log('no company registered'); process.exit(0); }
          const browser = await chromium.launch();
          const ctx = await browser.newContext({ locale: 'ja-JP', timezoneId: 'Asia/Tokyo' });
          await ctx.addInitScript(({ code, comp, name }) => {
            try {
              if (location.hostname.endsWith('github.io')) {
                localStorage.setItem('trisight_access_code', code);
                localStorage.setItem('trisight_dig_company', comp);
                localStorage.setItem('trisight_dig_company_name', name);
              }
            } catch (e) {}
          }, { code: CODE, comp, name });
          const page = await ctx.newPage();
          page.on('dialog', (d) => { d.accept().catch(() => {}); });
          await page.goto('https://testarossa1209-claude.github.io/TriSight/TriGate.html?night=1', { waitUntil: 'load', timeout: 120000 });
          log('opened');
          const t0 = Date.now();
          let title = '', last = '';
          while (Date.now() - t0 < 280 * 60000) {
            await page.waitForTimeout(30000);
            title = await page.title().catch(() => '');
            if (title !== last) { log('title: ' + title); last = title; }
            if (/自動発掘 (完了|中止)/.test(title)) break;
          }
          const banner = await page.evaluate(() => {
            const b = document.getElementById('nightBanner'); return b ? b.textContent : '';
          }).catch(() => '');
          await page.waitForTimeout(20000);
          await browser.close();
          if (/自動発掘 完了/.test(title)) { log('done'); process.exit(0); }
          log('not completed: ' + (banner || 'timeout'));
          process.exit(1);
          EOF
          node night.mjs
