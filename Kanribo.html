<!DOCTYPE html>
<html lang="ja">
<head>
<script>
/* 2026-10-30：開くときの関所（宏史さんの指示「住所を打てば誰でも開ける仕様はなくしてください。最初に開くときだけで問題ありません」）。
   この端末で一度、契約にトライサイトが含まれる認証コードを確かめるまでは、画面の中身を出さない。
   確かめた後は、開くたびに裏で同じコードを中継に聞き直し、契約が止まっていれば次からまた聞く。 */
(function(){var R=window.TT_RAW,v="";try{v=R?R.get("trisight_open_trisight"):localStorage.getItem("trisight_open_trisight");}catch(e){}
if(v!=="1")document.documentElement.className+=" openLocked";})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>TriSight ── トークン利用管理簿</title>
<meta name="theme-color" content="#16213a">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#16213a; --ink-soft:#3a4a63; --bg:#eef1f5; --surface:#ffffff;
    --line:#d6dbe3; --muted:#69748a; --fix:#b4452f; --soft:#c8742a;
    --verify:#8a6d1f; --verify-bg:#fbf6e6; --ok:#2f6b4f;
    --shadow:0 1px 2px rgba(22,33,58,.06),0 8px 24px rgba(22,33,58,.07);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
    line-height:1.7;font-size:15px;}
  .wrap{max-width:980px;margin:0 auto;padding:28px 20px 80px}
  header{margin-bottom:22px}
  .brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .brand h1{font-size:24px;letter-spacing:.04em;margin:0;font-weight:800}
  .brand .sub{font-size:13px;color:var(--muted);letter-spacing:.08em}
  .lead{margin:10px 0 0;color:var(--ink-soft);font-size:14px}
  .rule{height:3px;background:linear-gradient(90deg,var(--ink) 0 64px,var(--line) 64px);margin:16px 0 0}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;
    box-shadow:var(--shadow);padding:18px 20px;margin-top:18px}
  label{font-size:13px;font-weight:700;color:var(--ink-soft)}
  input[type=password],input[type=number]{border:1.5px solid var(--line);border-radius:8px;
    padding:9px 12px;font-size:15px;width:260px;max-width:100%}
  button{background:var(--ink);color:#fff;border:none;border-radius:8px;
    padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer}
  button.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
  button:disabled{opacity:.5;cursor:default}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13.5px}
  th{background:var(--ink);color:#fff;padding:8px 10px;text-align:left;font-weight:700;white-space:nowrap}
  td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:middle}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .bar{height:8px;background:#e6eaf0;border-radius:4px;overflow:hidden;min-width:120px}
  .bar>i{display:block;height:100%;background:var(--ok)}
  .bar>i.warn{background:var(--soft)}
  .bar>i.over{background:var(--fix)}
  .warnband{margin-top:14px;background:var(--verify-bg);border:1px solid var(--verify);
    border-radius:8px;padding:10px 14px;font-size:14px;color:var(--verify);font-weight:700;display:none}
  .msg{margin-top:10px;font-size:13px;color:var(--muted)}
  .roleTag{font-size:12px;font-weight:800;letter-spacing:.1em;color:#fff;background:var(--ink);
    border-radius:3px;padding:3px 8px;margin-left:8px;display:none}
</style>
<style>html.openLocked body>*:not(#openGate){display:none!important}html.openLocked body>#openGate{display:flex!important}</style>
</head>
<body>
<!-- 2026-10-15：前のページに戻るボタン（全画面共通・マウスの「戻る」と同じ動き。前のページが無いときは表札へ） -->
<div id="tsBackBar" data-guard="1" style="padding:8px 16px 4px;box-sizing:border-box;text-align:left;width:100%;align-self:stretch"><button type="button" onclick="tsGoBack()" title="ひとつ前に開いていた画面へ戻ります" style="font-family:inherit;font-size:13px;line-height:1.4;color:#1f2328;background:#ffffff;border:1px solid #afb8c1;border-radius:999px;padding:4px 14px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.12)">‹ 前のページに戻る</button></div>
<style>@media print{#tsBackBar{display:none !important}}</style>
<script>
function tsGoBack(){
  var b=document.getElementById("tsBackBar");
  if(b&&b.getAttribute("data-guard")==="1"){
    var typed=[].some.call(document.querySelectorAll("textarea,input[type=text],input:not([type])"),function(e){return e.value&&e.value.trim();});
    if(typed&&!confirm("この画面に入力した内容は保存されていません。前のページに戻ると消えます。戻りますか？"))return;
  }
  var r="";try{r=document.referrer?new URL(document.referrer).origin:"";}catch(e){}
  if(history.length>1&&r===location.origin){history.back();}else{location.href="index.html";}
}
</script>

<div class="wrap">
  <header>
    <div class="brand">
      <h1>トークン利用管理簿</h1>
      <span class="sub">TriSight® USAGE LEDGER</span>
      <span class="roleTag" id="roleTag"></span>
    </div>
    <p class="lead">認証コード別のAPIトークン使用量を表示します。表示範囲は入力された認証コードにより自動で切り替わります（管理コード＝全契約先／代理店コード＝自社顧客分のみ）。</p>
    <div class="rule"></div>
  </header>

  <div class="card">
    <label for="code">認証コード</label><br>
    <input type="password" id="code" placeholder="認証コードを入力" autocomplete="off">
    <button id="loadBtn" onclick="load()">表示する</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="warnband" id="warnband"></div>

  <div class="card" id="tableCard" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
      <div style="font-weight:800" id="monthLabel"></div>
      <div>
        <button class="ghost" onclick="load()">再読込</button>
        <button onclick="exportXlsx()">Excel出力</button>
      </div>
    </div>
    <div style="overflow-x:auto"><table id="tbl">
      <thead><tr>
        <th>認証コード</th><th>呼出回数</th><th>入力トークン</th><th>出力トークン</th>
        <th>合計</th><th>月間上限</th><th>使用率</th><th>先月合計</th><th>最終利用</th>
        <th id="thLimit" style="display:none">上限設定</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table></div>
    <div class="msg">使用量は当社リレーの記録をもって確定値とします。上限の80%を超えた契約は上部に予告表示されます。Excel出力はその時点のスナップショットです。</div>
  </div>
</div>

<script>
const USAGE_API = "https://trisight-relay.vercel.app/api/usage";
let lastData = null;

function fmt(n){ return (n||0).toLocaleString("ja-JP"); }
function maskCode(c){ return c.length<=4 ? c : c.slice(0,3)+"****"+c.slice(-2); }

async function load(){
  const code = document.getElementById("code").value.trim();
  const msg = document.getElementById("msg");
  if(!code){ msg.textContent = "認証コードを入力してください。"; return; }
  msg.textContent = "読み込み中…";
  try{
    const r = await fetch(USAGE_API, { headers: { "x-trisight-code": code } });
    const j = await r.json();
    if(!r.ok){ msg.textContent = j.error || "読み込みに失敗しました。"; return; }
    lastData = j; msg.textContent = "";
    render(j, code);
  }catch(e){ msg.textContent = "通信に失敗しました。ネットワークをご確認ください。"; }
}

function render(j, code){
  const isAdmin = j.role === "admin";
  const tag = document.getElementById("roleTag");
  tag.style.display = "inline-block";
  tag.textContent = isAdmin ? "トライサイト（全体）" : "代理店閲覧窓";
  document.getElementById("thLimit").style.display = isAdmin ? "" : "none";
  document.getElementById("tableCard").style.display = "block";

  const tb = document.getElementById("tbody"); tb.innerHTML = "";
  const warns = [];
  let monthLabel = "";
  for(const row of j.rows){
    monthLabel = row.month;
    const total = (row.current.in||0)+(row.current.out||0);
    const prevTotal = (row.previous.in||0)+(row.previous.out||0);
    const pct = row.limit ? Math.min(999, Math.round(total/row.limit*100)) : null;
    if(pct!==null && pct>=80) warns.push({code:row.code, pct});
    const barCls = pct===null? "" : pct>=100? "over" : pct>=80? "warn" : "";
    const tr = document.createElement("tr");
    tr.innerHTML =
      `<td>${isAdmin? row.code : maskCode(row.code)}</td>`+
      `<td class="num">${fmt(row.current.calls)}</td>`+
      `<td class="num">${fmt(row.current.in)}</td>`+
      `<td class="num">${fmt(row.current.out)}</td>`+
      `<td class="num"><b>${fmt(total)}</b></td>`+
      `<td class="num">${row.limit? fmt(row.limit) : "―"}</td>`+
      `<td>${pct===null? '<span style="color:var(--muted)">上限なし</span>' :
         `<div class="bar"><i class="${barCls}" style="width:${Math.min(pct,100)}%"></i></div><span style="font-size:12px">${pct}%</span>`}</td>`+
      `<td class="num">${fmt(prevTotal)}</td>`+
      `<td style="font-size:12px;white-space:nowrap">${row.current.last? row.current.last.slice(0,16).replace("T"," ") : "―"}</td>`+
      (isAdmin? `<td><input type="number" style="width:110px" placeholder="上限" value="${row.limit||""}" id="lim_${row.code}">
        <button class="ghost" style="padding:6px 10px;font-size:12px" onclick="saveLimit('${row.code}')">保存</button></td>` : "");
    tb.appendChild(tr);
  }
  document.getElementById("monthLabel").textContent = `対象月：${monthLabel}（日本時間）`;
  const band = document.getElementById("warnband");
  if(warns.length){
    band.style.display = "block";
    band.textContent = "【超過前予告】上限の80%に到達した契約があります： " +
      warns.map(w=>`${isAdmin? w.code : maskCode(w.code)}（${w.pct}%）`).join(" ／ ");
  } else band.style.display = "none";
}

async function saveLimit(target){
  const code = document.getElementById("code").value.trim();
  const v = document.getElementById("lim_"+target).value;
  const r = await fetch(USAGE_API, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "x-trisight-code": code },
    body: JSON.stringify({ code: target, limit: v===""? null : +v })
  });
  if(r.ok) load(); else alert("上限の保存に失敗しました。");
}

function exportXlsx(){
  if(!lastData) return;
  const rows = lastData.rows.map(r=>({
    "対象月": r.month,
    "認証コード": r.code,
    "呼出回数": r.current.calls||0,
    "入力トークン": r.current.in||0,
    "出力トークン": r.current.out||0,
    "合計トークン": (r.current.in||0)+(r.current.out||0),
    "月間上限": r.limit||"",
    "先月合計": (r.previous.in||0)+(r.previous.out||0),
    "最終利用": r.current.last||""
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "トークン利用明細");
  const d = new Date(); const jst = new Date(d.getTime()+9*3600*1000);
  const stamp = jst.toISOString().slice(0,10);
  XLSX.writeFile(wb, `トークン利用明細_${stamp}.xlsx`);
}
</script>
<script>
(function(){
  var KEY="trisight_open_trisight",CKEY="trisight_open_trisight_code",PRODUCT="trisight",NAME="トライサイト";
  var RELAY="https://trisight-relay.vercel.app/api/gate";
  var R=window.TT_RAW||{get:function(k){return localStorage.getItem(k);},set:function(k,v){localStorage.setItem(k,v);},del:function(k){localStorage.removeItem(k);}};
  function lsGet(k){try{return R.get(k)||"";}catch(e){return "";}}
  function forget(){try{R.del(KEY);R.del(CKEY);}catch(e){}}
  function ask(c){return fetch(RELAY,{method:"POST",headers:{"Content-Type":"application/json","x-trisight-code":c},body:JSON.stringify({task:"portal",payload:{product:PRODUCT}})})
    .then(function(res){return res.json().catch(function(){return {};}).then(function(j){return {s:res.status,j:j};});});}
  if(document.documentElement.className.indexOf("openLocked")<0){
    var saved=lsGet(CKEY);
    if(saved)ask(saved).then(function(o){if(o.s===401||(o.s===200&&o.j&&o.j.portal===false)){forget();location.reload();}},function(){});
    return;
  }
  var w=document.createElement("div");w.id="openGate";
  w.setAttribute("style","position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:linear-gradient(165deg,#0c1830,#16264a 55%,#0b1428);font-family:inherit");
  w.innerHTML='<div style="background:#fff;border-radius:14px;max-width:420px;width:100%;padding:24px 22px 18px;box-sizing:border-box;box-shadow:0 26px 60px -30px rgba(0,0,0,.7);color:#16213a">'
   +'<div style="font-family:Georgia,serif;font-weight:800;font-size:22px;color:#0f1d3a">'+NAME+'</div>'
   +'<div style="font-weight:700;font-size:16px;margin:8px 0 6px">認証コードを入れてください</div>'
   +'<div style="font-size:13px;line-height:1.7;color:#5b6680;margin-bottom:10px">この画面は、ご契約の認証コードで開きます。この端末で一度確かめると、次からは聞きません。</div>'
   +'<input id="ogCode" type="password" autocomplete="off" style="width:100%;box-sizing:border-box;font-size:15px;padding:9px 10px;border:1px solid #afb8c1;border-radius:8px">'
   +'<div id="ogMsg" style="font-size:13px;color:#b42318;min-height:1.6em;margin-top:6px"></div>'
   +'<div style="text-align:right"><button type="button" id="ogGo" style="font-family:inherit;font-size:14px;padding:7px 18px;border:0;background:#0f1d3a;color:#fff;border-radius:999px;cursor:pointer">確かめて開く</button></div></div>';
  document.body.appendChild(w);
  var inp=document.getElementById("ogCode"),msg=document.getElementById("ogMsg"),go=document.getElementById("ogGo");
  var pre=lsGet("trisight_access_code");if(pre)inp.value=pre;
  inp.onkeydown=function(e){if(e.key==="Enter")go.click();};
  go.onclick=function(){
    var c=inp.value.trim();if(!c){msg.textContent="認証コードを入れてください。";return;}
    go.disabled=true;msg.style.color="#5b6680";msg.textContent="確かめています…";
    ask(c).then(function(o){
      go.disabled=false;msg.style.color="#b42318";
      if(o.s===200&&o.j&&o.j.portal===true){
        try{R.set(KEY,"1");R.set(CKEY,c);if(!lsGet("trisight_access_code"))R.set("trisight_access_code",c);}catch(e){}if(o.j&&Array.isArray(o.j.allowed))o.j.allowed.forEach(function(p){try{R.set("trisight_open_"+p,"1");R.set("trisight_open_"+p+"_code",c);if(p==="trisight"){R.set("trisight_portal_ok","1");R.set("trisight_portal_code",c);}}catch(e){}});
        w.remove();document.documentElement.className=document.documentElement.className.replace(/\s*openLocked/g,"");return;}
      if(o.s===200)msg.textContent="この認証コードのご契約には、"+NAME+"が含まれていません。";
      else if(o.s===401)msg.textContent="認証コードが一致しませんでした。";
      else if(o.s===429)msg.textContent=(o.j&&o.j.error)||"間違いが続いたため、しばらく受け付けません。";
      else if(o.s===400)msg.textContent="中継の更新がまだ済んでいないため、確かめられません。";
      else msg.textContent="確かめられませんでした（"+o.s+"）。少しおいてもう一度押してください。";
    },function(){go.disabled=false;msg.style.color="#b42318";msg.textContent="中継につながりませんでした。通信を確かめて、もう一度押してください。";});
  };
  setTimeout(function(){inp.focus();},50);
})();
</script>
</body>
</html>
