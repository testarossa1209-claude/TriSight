<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>基本情報シートへ移りました ｜ TriSight</title>
<meta http-equiv="refresh" content="3;url=TriSheet.html?mode=update">
<style>body{font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;background:#f6f3ec;color:#1a2433;margin:0;padding:40px 16px}
.box{max-width:560px;margin:0 auto;background:#fff;border:1px solid #d9d2c3;border-radius:10px;padding:24px 26px;line-height:1.8}
a{color:#1a2433;font-weight:700}</style></head>
<body>
<!-- 2026-10-15：前のページに戻るボタン（全画面共通・マウスの「戻る」と同じ動き。前のページが無いときは表札へ） -->
<div id="tsBackBar" data-guard="0" style="padding:8px 16px 4px;box-sizing:border-box;text-align:left;width:100%;align-self:stretch"><button type="button" onclick="tsGoBack()" title="ひとつ前に開いていた画面へ戻ります" style="font-family:inherit;font-size:13px;line-height:1.4;color:#1f2328;background:#ffffff;border:1px solid #afb8c1;border-radius:999px;padding:4px 14px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.12)">‹ 前のページに戻る</button></div>
<style>@media print{#tsBackBar{display:none !important}}</style>
<script>
function tsGoBack(){
  var b=document.getElementById("tsBackBar");
  if(b&&b.getAttribute("data-guard")==="1"){
    var typed=[].some.call(document.querySelectorAll("textarea,input[type=text],input:not([type])"),function(e){return e.value&&e.value.trim();});
    if(typed&&!confirm("この画面に入力した内容は保存されていません。前のページに戻ると消えます。戻りますか？"))return;
  }
  var r="";try{r=document.referrer?new URL(document.referrer).origin:"";}catch(e){}
  if(history.length>1&&r===location.origin){history.back();}else{location.href="index.html";}
}
</script>
<div class="box">
<p>事業所基本情報シート（トライベイス）は、<b>基本情報シート</b>に一本化しました（2026年9月）。<br>
入れてある法人・事業所の内容は、基本情報シートを開いたときに自動で引き継がれます。</p>
<p>・法人・事業所・加算区分などの入力 → <a href="TriSheet.html?mode=update">基本情報シートを開く</a><br>
・様式3-1の要件の申告・0円報告先 → <a href="TriReward_youken.html">要件の申告を開く</a></p>
<p style="font-size:13px;color:#6b6457">3秒後に基本情報シートへ移ります。</p>
</div></body></html>
