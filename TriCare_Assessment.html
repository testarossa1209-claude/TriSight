:root{--bg:#ffffff;--text:#1f2328;--text-secondary:#57606a;--text-muted:#8c959f;--border:#d8dee4;--border-strong:#afb8c1;

--surface-1:#f6f8fa;--radius:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--text:#e6edf3;--text-secondary:#9da7b3;--text-muted:#7d8590;--border:#30363d;--border-strong:#484f58;
--bg-accent:#0c2d6b;--text-accent:#79c0ff;--border-accent:#1f6feb;--text-danger:#ff7b72;--text-success:#3fb950;--text-warning:#d29922;--surface-1:#161b22}}
:root[data-theme="dark"]{--bg:#0d1117;--text:#e6edf3;--text-secondary:#9da7b3;--text-muted:#7d8590;--border:#30363d;--border-strong:#484f58;
--bg-accent:#0c2d6b;--text-accent:#79c0ff;--border-accent:#1f6feb;--text-danger:#ff7b72;--text-success:#3fb950;--text-warning:#d29922;--surface-1:#161b22}
body{background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans JP",sans-serif;font-size:14px;margin:0;padding:16px}
.wrap{max-width:1000px;margin:0 auto}
input,select,textarea,button{font:inherit;color:var(--text);background:var(--bg);border:0.5px solid var(--border-strong);border-radius:6px;padding:5px 8px;box-sizing:border-box}
button{cursor:pointer;background:var(--surface-1)}button:hover{border-color:var(--border-accent)}
a{color:var(--text-accent)}
.grp{margin:12px 0 2px;font-size:13px;font-weight:500;color:var(--text-secondary)}
.it{display:grid;grid-template-columns:200px minmax(0,1fr);gap:10px;align-items:start;padding:5px 0}
@media (max-width:640px){.it{grid-template-columns:1fr;gap:2px}}
.lb{font-size:13px;color:var(--text-secondary);padding-top:8px}
.nt{font-size:12px;color:var(--text-muted);margin-top:3px}
.ops{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;padding-top:6px}
.ops label{display:flex;align-items:center;gap:4px;border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:5px 10px;cursor:pointer;user-select:none}
.ops label:has(input:checked){background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.ops input{width:auto;margin:0;cursor:pointer}
.ofc{border:0.5px solid var(--border);border-radius:12px;padding:10px 14px;margin:8px 0;background:var(--bg)}
.usr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:0.5px solid var(--border);border-radius:var(--radius);padding:8px 12px;margin:6px 0;background:var(--surface-1)}
.usr .nm{flex:1;min-width:200px}
.usr button.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.notice{margin:10px 0 14px;padding:10px 12px;border:0.5px solid var(--border-accent);border-radius:var(--radius);background:var(--surface-1);font-size:13px;line-height:1.7}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;font-size:13px}
.empty-guide{font-size:14px;color:var(--text-secondary);padding:14px;margin-top:12px;border:0.5px dashed var(--border-strong);border-radius:var(--radius)}

<style>@media print{#tsBackBar{display:none !important}}</style>
<script>
function tsGoBack(){
  var b=document.getElementById("tsBackBar");
  if(b&&b.getAttribute("data-guard")==="1"){
    var typed=[].some.call(document.querySelectorAll("textarea,input[type=text],input:not([type])"),function(e){return e.value&&e.value.trim();});
    if(typed&&!confirm("この画面に入力した内容は保存されていません。前のページに戻ると消えます。戻りますか？"))return;
  }
  var r="";try{r=document.referrer?new URL(document.referrer).origin:"";}catch(e){}
  if(history.length>1&&r===location.origin){history.back();}else{location.href="index.html";}
}
</script>

<script>
/* ============================================================
   トライケア アセスメント・モニタリング（2026-10-14）
   ・2026-10-14の決定：アセスメントは利用者の要配慮個人情報を含むため、会社の基本情報シート（TriSheet）から外し、
     トライケアの中に移す。保存先は この端末の tricare_assessment_v1 だけ。通信は版の照合（version.json）以外に行わない。
   ・項目の出所：ノア・コーポレーション合同会社が使用している「アセスメントシート.xls」（全5シート）、
     「モニタリングシート_縦書用_.xls」、「モニタリング表_纏め半年分_.xls」（2026-09-18 提供）。居宅介護支援の様式。
   ・基本情報シートに入っていた利用者は、この画面か基本情報シートを開いたときに、ここへ移して元帳から消す。
   ============================================================ */
var CARE_KEY='tricare_assessment_v1', MASTER_KEY='trisight_office_master_v1';
/* ---- 利用者の記録をトライケアへ移す（2026-10-14・基本情報シートとトライケアの両方に同じ処理を置く。何度動いても同じ結果になる） ---- */
function careId(){return 'u'+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36);}
function careLoad(){var d=null;try{d=JSON.parse(localStorage.getItem(CARE_KEY)||'null');}catch(e){d=null;}if(!d||!Array.isArray(d.users))d={version:1,users:[]};return d;}
function careSave(d){try{localStorage.setItem(CARE_KEY,JSON.stringify(d));return true;}catch(e){return false;}}
function careFromJson(u){return {name:u['氏名または契約書番号']||'',office:u['事業所']||'',asm:u['アセスメント']||{},moni:[].concat(u['モニタリング']||[])};}
function careAdd(d,list,company){
  var sig=function(x){return JSON.stringify([x.company||'',x.name||'',x.office||'',x.asm||{},x.moni||[]]);};
  var seen={};d.users.forEach(function(u){seen[sig(u)]=1;});
  var n=0;
  (list||[]).forEach(function(u){
    if(!u)return;
    var x={id:careId(),company:company||'',name:String(u.name||'').trim(),office:u.office||'',asm:(u.asm&&typeof u.asm==='object')?u.asm:{},moni:Array.isArray(u.moni)?u.moni:[]};
    if(!x.name&&!Object.keys(x.asm).length&&!x.moni.length)return;
    var s=sig(x);if(seen[s])return;seen[s]=1;d.users.push(x);n++;
  });
  return n;
}
function careStripJson(j,d,company){
  /* 書き出し（.json の形）から利用者の記録を抜き出して d へ移し、元からは消す。触ったら true */
  if(!j||typeof j!=='object')return false;
  var t=false,K='アセスメント対象の利用者';
  if(Array.isArray(j[K])){careAdd(d,j[K].map(careFromJson),company);delete j[K];t=true;}
  else if(K in j){delete j[K];t=true;}
  if(Array.isArray(j['追加利用システム'])&&j['追加利用システム'].indexOf('トライケア')>=0){j['追加利用システム']=j['追加利用システム'].filter(function(x){return x!=='トライケア';});t=true;}
  return t;
}
function careMigrate(){
  /* 戻り値：移した人数（0＝移すものなし）、-1＝トライケア側へ保存できなかった（元帳は書き換えない） */
  var m=null;try{m=JSON.parse(localStorage.getItem(MASTER_KEY)||'null');}catch(e){m=null;}
  if(!m||!Array.isArray(m.orgs))return 0;
  var d=careLoad(),before=d.users.length,touched=false;
  m.orgs.forEach(function(o){
    if(!o)return;
    var nm=(o.corp&&o.corp.name)||(o.sheet&&o.sheet.val&&o.sheet.val['法人名'])||'';
    var sh=o.sheet;
    if(sh){
      if(Array.isArray(sh.users)&&sh.users.length){careAdd(d,sh.users,nm);sh.users=[];touched=true;}
      if(sh.useCare){sh.useCare=false;touched=true;}
      if(careStripJson(sh.BASE,d,nm))touched=true;
      (sh.offices||[]).forEach(function(of){if(of&&('asm' in of)){delete of.asm;touched=true;}});
    }
    if(careStripJson(o.gateJSON,d,nm))touched=true;
  });
  if(!touched)return 0;
  if(!careSave(d))return -1;
  try{localStorage.setItem(MASTER_KEY,JSON.stringify(m));}catch(e){}
  return d.users.length-before;
}

  var w=document.createElement("div");w.id="openGate";
  w.setAttribute("style","position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:linear-gradient(165deg,#0c1830,#16264a 55%,#0b1428);font-family:inherit");
  w.innerHTML='<div style="background:#fff;border-radius:14px;max-width:420px;width:100%;padding:24px 22px 18px;box-sizing:border-box;box-shadow:0 26px 60px -30px rgba(0,0,0,.7);color:#16213a">'
   +'<div style="font-family:Georgia,serif;font-weight:800;font-size:22px;color:#0f1d3a">'+NAME+'</div>'
   +'<div style="font-weight:700;font-size:16px;margin:8px 0 6px">認証コードを入れてください</div>'
   +'<div style="font-size:13px;line-height:1.7;color:#5b6680;margin-bottom:10px">この画面は、ご契約の認証コードで開きます。この端末で一度確かめると、次からは聞きません。</div>'
   +'<input id="ogCode" type="password" autocomplete="off" style="width:100%;box-sizing:border-box;font-size:15px;padding:9px 10px;border:1px solid #afb8c1;border-radius:8px">'
   +'<div id="ogMsg" style="font-size:13px;color:#b42318;min-height:1.6em;margin-top:6px"></div>'
   +'<div style="text-align:right"><button type="button" id="ogGo" style="font-family:inherit;font-size:14px;padding:7px 18px;border:0;background:#0f1d3a;color:#fff;border-radius:999px;cursor:pointer">確かめて開く</button></div></div>';
  document.body.appendChild(w);
  var inp=document.getElementById("ogCode"),msg=document.getElementById("ogMsg"),go=document.getElementById("ogGo");
  var pre=lsGet("trisight_access_code");if(pre)inp.value=pre;
  inp.onkeydown=function(e){if(e.key==="Enter")go.click();};
  go.onclick=function(){
    var c=inp.value.trim();if(!c){msg.textContent="認証コードを入れてください。";return;}
    go.disabled=true;msg.style.color="#5b6680";msg.textContent="確かめています…";
    ask(c).then(function(o){
      go.disabled=false;msg.style.color="#b42318";
      if(o.s===200&&o.j&&o.j.portal===true){
        try{R.set(KEY,"1");R.set(CKEY,c);if(!lsGet("trisight_access_code"))R.set("trisight_access_code",c);}catch(e){}if(o.j&&Array.isArray(o.j.allowed))o.j.allowed.forEach(function(p){try{R.set("trisight_open_"+p,"1");R.set("trisight_open_"+p+"_code",c);if(p==="trisight"){R.set("trisight_portal_ok","1");R.set("trisight_portal_code",c);}}catch(e){}});
        w.remove();document.documentElement.className=document.documentElement.className.replace(/\s*openLocked/g,"");return;}
      if(o.s===200)msg.textContent="この認証コードのご契約には、"+NAME+"が含まれていません。";
      else if(o.s===401)msg.textContent="認証コードが一致しませんでした。";
      else if(o.s===429)msg.textContent=(o.j&&o.j.error)||"間違いが続いたため、しばらく受け付けません。";
      else if(o.s===400)msg.textContent="中継の更新がまだ済んでいないため、確かめられません。";
      else msg.textContent="確かめられませんでした（"+o.s+"）。少しおいてもう一度押してください。";
    },function(){go.disabled=false;msg.style.color="#b42318";msg.textContent="中継につながりませんでした。通信を確かめて、もう一度押してください。";});
  };
  setTimeout(function(){inp.focus();},50);
})();
</script>
</body></html>
