// ===== マッチング判定ロジック =====
function calculateMatchScore(member, grant) {
  let score = 0;
  let reasons = [];
  let exclusionReasons = [];
  
  if (grant.target_industries.includes('全業種')) {
    score += 30;
    reasons.push('全業種対象');
  } else if (grant.target_industries.includes(member.industry_major)) {
    if (grant.target_industries_minor && grant.target_industries_minor.length > 0) {
      if (grant.target_industries_minor.includes(member.industry_minor)) {
        score += 30;
        reasons.push(`業種完全一致（${member.industry_minor}）`);
      } else {
        score += 10;
        reasons.push(`業種大分類一致（${member.industry_major}）`);
      }
    } else {
      score += 25;
      reasons.push(`業種大分類一致（${member.industry_major}）`);
    }
  } else {
    exclusionReasons.push(`対象業種外（${member.industry_minor}）`);
  }
  
  if (grant.max_employee_count !== null && member.employee_count > grant.max_employee_count) {
    exclusionReasons.push(`従業員数超過（${member.employee_count}名 > 上限${grant.max_employee_count}名）`);
  } else if (grant.min_employee_count !== null && member.employee_count < grant.min_employee_count) {
    exclusionReasons.push(`従業員数不足（${member.employee_count}名 < 下限${grant.min_employee_count}名）`);
  } else {
    score += 20;
    if (grant.max_employee_count !== null) reasons.push(`従業員規模範囲内`);
  }
  
  if (grant.target_prefecture) {
    if (member.prefecture === grant.target_prefecture) {
      score += 5;
      reasons.push(`所在地一致（${grant.target_prefecture}）`);
    } else {
      exclusionReasons.push(`所在地不一致（${grant.target_prefecture}内事業所のみ対象）`);
    }
  }
  
  if (grant.required_certifications && grant.required_certifications.length > 0) {
    const reqCert = grant.required_certifications[0];
    if (reqCert.includes('介護保険') && member.industry_minor === '介護・看護') {
      score += 30;
      reasons.push('必要認証保有（介護保険事業者指定）');
    } else if (reqCert.includes('障害福祉') && member.industry_minor === '障害福祉') {
      score += 30;
      reasons.push('必要認証保有（障害福祉サービス事業者指定）');
    } else if (reqCert.includes('保育') && member.industry_minor === '保育・子育て支援') {
      score += 30;
      reasons.push('必要認証保有');
    } else if (reqCert.includes('建設業許可') && member.industry_major === '建設業') {
      score += 30;
      reasons.push('必要認証保有（建設業許可）');
    } else if (reqCert.includes('一般貨物') && member.industry_minor === '貨物運送') {
      score += 30;
      reasons.push('必要認証保有');
    } else if (reqCert.includes('旅客自動車') && member.industry_minor === '旅客運送') {
      score += 30;
      reasons.push('必要認証保有');
    } else {
      exclusionReasons.push(`必要認証なし（${reqCert}）`);
    }
  } else {
    score += 25;
  }
  
  if (member.previous_grant_received && member.previous_grant_received.includes(grant.grant_name)) {
    score += 10;
    reasons.push('同種助成金の採択実績あり');
  }
  
  const deadline = new Date(grant.application_deadline);
  const today = new Date('2026-05-18');
  const daysUntilDeadline = Math.floor((deadline - today) / (1000 * 60 * 60 * 24));
  if (daysUntilDeadline >= 30) {
    score += 10;
    reasons.push(`期限まで${daysUntilDeadline}日（十分な準備期間）`);
  } else if (daysUntilDeadline >= 14) {
    score += 5;
    reasons.push(`期限まで${daysUntilDeadline}日（要急ぎ）`);
  } else if (daysUntilDeadline > 0) {
    reasons.push(`期限まで${daysUntilDeadline}日（厳しい）`);
  } else {
    exclusionReasons.push('申請期限経過');
  }
  
  if (grant.adoption_rate_percent >= 85) {
    score += 5;
    reasons.push(`採択率${grant.adoption_rate_percent}%（高採択率）`);
  }
  
  let grade = 'X';
  if (exclusionReasons.length > 0) {
    grade = 'X';
  } else if (score >= 80) {
    grade = 'A';
  } else if (score >= 60) {
    grade = 'B';
  } else if (score >= 40) {
    grade = 'C';
  } else {
    grade = 'X';
    exclusionReasons.push(`総合スコア不足（${score}点）`);
  }
  
  return {
    member_id: member.member_id,
    grant_id: grant.grant_id,
    grant_name: grant.grant_name,
    score: score,
    grade: grade,
    reasons: reasons,
    exclusion_reasons: exclusionReasons,
    deadline: grant.application_deadline,
    days_until_deadline: daysUntilDeadline,
    max_amount: grant.max_grant_amount_yen,
    ministry: grant.ministry
  };
}

// ===== マッチング実行 =====
async function runMatching() {
  document.getElementById('btnRunMatching').disabled = true;
  document.getElementById('resultsTitle').textContent = 'マッチング処理中...';
  
  const total = members.length;
  matchingResults = [];
  
  for (let i = 0; i < members.length; i++) {
    const member = members[i];
    const memberMatches = [];
    
    for (const grant of grants) {
      memberMatches.push(calculateMatchScore(member, grant));
    }
    
    matchingResults.push({
      member: member,
      matches: memberMatches
    });
    
    const progress = Math.floor(((i + 1) / total) * 100);
    document.getElementById('resultsContent').innerHTML = `
      <div class="loading">
        <div class="spinner"></div>
        マッチング処理中（${i + 1}/${total}社）
        <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
      </div>
    `;
    
    if (currentMode === 'MOCK') {
      await new Promise(r => setTimeout(r, 50));
    }
  }
  
  let totalA = 0, totalB = 0, totalC = 0, totalX = 0;
  for (const result of matchingResults) {
    for (const match of result.matches) {
      if (match.grade === 'A') totalA++;
      else if (match.grade === 'B') totalB++;
      else if (match.grade === 'C') totalC++;
      else totalX++;
    }
  }
  document.getElementById('statMatches').textContent = totalA;
  document.getElementById('statExcluded').textContent = totalX;
  document.getElementById('btnIndustrySummary').disabled = false;
  document.getElementById('btnChecklist').disabled = false;
  
  displayMatchingResults();
}
// ===== マッチング結果表示 =====
function displayMatchingResults() {
  document.getElementById('resultsTitle').textContent = '会員別マッチング結果';
  
  let html = '';
  for (const result of matchingResults) {
    const m = result.member;
    const matchA = result.matches.filter(x => x.grade === 'A').sort((a,b) => b.score - a.score);
    const matchB = result.matches.filter(x => x.grade === 'B').sort((a,b) => b.score - a.score);
    const matchC = result.matches.filter(x => x.grade === 'C').sort((a,b) => b.score - a.score);
    const matchX = result.matches.filter(x => x.grade === 'X');
    
    html += `
      <div class="member-card">
        <div class="member-name">${m.company_name}</div>
        <div class="member-meta">
          ${m.industry_major}／${m.industry_minor}｜従業員${m.employee_count}名｜売上${m.annual_revenue_million}百万円｜${m.prefecture}${m.city}
        </div>
        <div class="grade-summary">
          <span class="grade-badge grade-A">適合A: ${matchA.length}件</span>
          <span class="grade-badge grade-B">適合B: ${matchB.length}件</span>
          <span class="grade-badge grade-C">適合C: ${matchC.length}件</span>
          <span class="grade-badge grade-X">除外: ${matchX.length}件</span>
          <button class="btn btn-secondary" style="margin-left:auto; padding:4px 12px; font-size:11px;" onclick="toggleDetails('${m.member_id}')">詳細表示</button>
        </div>
        <div class="grant-list" id="details-${m.member_id}">
          ${matchA.length > 0 ? '<div style="color:#4CAF50; font-weight:bold; margin-top:8px;">▶ 適合A（採択可能性高）</div>' : ''}
          ${matchA.map(g => `
            <div class="grant-item">
              <div class="grant-name">${g.grant_name}（${g.ministry}）</div>
              <div class="grant-reason">
                スコア${g.score}点｜期限${g.deadline}（残${g.days_until_deadline}日）｜上限${g.max_amount ? g.max_amount.toLocaleString() + '円' : '非公表'}<br>
                理由：${g.reasons.join('、')}
              </div>
            </div>
          `).join('')}
          ${matchB.length > 0 ? '<div style="color:#FFC107; font-weight:bold; margin-top:8px;">▶ 適合B（要件確認必要）</div>' : ''}
          ${matchB.slice(0,3).map(g => `
            <div class="grant-item">
              <div class="grant-name">${g.grant_name}</div>
              <div class="grant-reason">スコア${g.score}点｜${g.reasons.join('、')}</div>
            </div>
          `).join('')}
          ${matchX.length > 0 ? '<div style="color:#888; font-weight:bold; margin-top:8px;">▶ 除外（要件不適合）</div>' : ''}
          ${matchX.slice(0,3).map(g => `
            <div class="grant-item" style="opacity:0.6;">
              <div class="grant-name">${g.grant_name}</div>
              <div class="grant-reason">除外理由：${g.exclusion_reasons.join('、')}</div>
            </div>
          `).join('')}
          ${matchX.length > 3 ? `<div style="color:#888; font-size:11px; padding:4px 12px;">他${matchX.length - 3}件の除外案件あり</div>` : ''}
        </div>
      </div>
    `;
  }
  
  document.getElementById('resultsContent').innerHTML = html;
}

function toggleDetails(memberId) {
  const el = document.getElementById(`details-${memberId}`);
  el.classList.toggle('expanded');
}

      summary[key] = {
        major: result.member.industry_major,
        minor: key,
        company_count: 0,
        total_A: 0,
        total_B: 0,
        common_grants: {},
        avg_A: 0
      };
    }
    const matchA = result.matches.filter(x => x.grade === 'A');
    const matchB = result.matches.filter(x => x.grade === 'B');
    summary[key].company_count++;
    summary[key].total_A += matchA.length;
    summary[key].total_B += matchB.length;
    for (const m of matchA) {
      summary[key].common_grants[m.grant_name] = (summary[key].common_grants[m.grant_name] || 0) + 1;
    }
  }
  
  let html = '';
  for (const k in summary) {
    const s = summary[k];
    s.avg_A = (s.total_A / s.company_count).toFixed(1);
    const sortedGrants = Object.entries(s.common_grants).sort((a,b) => b[1] - a[1]).slice(0, 5);
    
    html += `
      <div class="member-card">
        <div class="member-name">${s.major} ／ ${s.minor}</div>
        <div class="member-meta">該当会員 ${s.company_count}社｜適合A総数 ${s.total_A}件｜平均 ${s.avg_A}件/社</div>
        <div style="margin-top:12px; padding-top:12px; border-top:1px dashed rgba(255,255,255,0.2);">
          <div style="color:#c9a96e; font-weight:bold; margin-bottom:8px;">業界共通の高適合助成金（上位5件）</div>
          ${sortedGrants.map(([name, count]) => `
            <div class="grant-item">
              <div class="grant-name">${name}</div>
              <div class="grant-reason">${count}社が適合A判定（業界内${Math.round(count/s.company_count*100)}%）</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }
  
  document.getElementById('resultsContent').innerHTML = html;
}

// ===== CSV取込機能 =====
function importCSV(event, type) {
  const file = event.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const csvText = e.target.result;
      const parsed = parseCSV(csvText);
      
      if (type === 'members') {
        members = parsed;
        document.getElementById('statMembers').textContent = members.length;
        document.getElementById('importStatus').innerHTML = 
          '<span style="color:#4CAF50;">✓ 会員データ取込完了：' + members.length + '社</span>';
      } else {
        grants = parsed;
        document.getElementById('statGrants').textContent = grants.length;
        document.getElementById('importStatus').innerHTML = 
          '<span style="color:#4CAF50;">✓ 助成金データ取込完了：' + grants.length + '件</span>';
      }
      
      document.getElementById('stats').style.display = 'grid';
      if (members.length > 0 && grants.length > 0) {
        document.getElementById('btnRunMatching').disabled = false;
      }
    } catch (err) {
      document.getElementById('importStatus').innerHTML = 
        '<span style="color:#ff6b6b;">✗ 取込エラー：' + err.message + '</span>';
    }
  };
  reader.readAsText(file, 'UTF-8');
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) throw new Error('データ行が見つかりません');
  
  const headers = parseCSVLine(lines[0]);
  const result = [];
  
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const values = parseCSVLine(lines[i]);
    const obj = {};
    headers.forEach((h, idx) => {
      let v = values[idx] || '';
      if (/^-?\d+(\.\d+)?$/.test(v)) v = Number(v);
      else if (v === 'true') v = true;
      else if (v === 'false') v = false;
      else if (v.includes('|')) v = v.split('|').map(s => s.trim()).filter(s => s);
      else if (v === '') v = null;
      obj[h] = v;
    });
    result.push(obj);
  }
  return result;
}

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') {
      if (inQuotes && line[i+1] === '"') {
        current += '"';
        i++;
      } else {
        inQuotes = !inQuotes;
      }
    } else if (c === ',' && !inQuotes) {
      result.push(current.trim());
      current = '';
    } else {
      current += c;
    }
  }
  result.push(current.trim());
  return result;
}
