<!--
  TriPlan.html — 補助金・助成金 受給計画書（2026-11-21 新設・宏史さんの決定）
  ・決裁者が「どれを取るか」を決める材料。1ページ目＝一覧と判断欄／2ページ目＝時系列／以降＝制度ごとの詳細・確認待ち・見送り・約束ごと
  ・中身は「受給計画データ」（JSON）を読み込んで出す。会社の情報は公開の場所（GitHub）に置かない（基礎情報シートと同じ扱い）
  ・判断欄で「進める」にした制度は、そのまま獲得スケジュールに載せる（受け渡し箱 tritask_inbox に入れ、決裁の印 tg_kessai を go にする）
    宏史さんの判断（2026-11-21）「受給計画で決済が取れた最終的な助成金で獲得スケジュールを組んだ方が確実」
  ・全ページの頭と最終行に当社のマークを入れる（レターヘッドの決まり 2026-09-02・11-08）
  ・2026-11-21-02：A4横向きに変更（宏史さんの指示「シートを横書きに。幅が狭い」）。時系列を制度ごとに分けた
  ・2026-11-22-01：1ページ目の「支給の決まり方」の欄を「AIの判定（取るべきか）」に替えた。誰が行うか・時間と手間・費用・戻る額・御社の負担・支給の決まり方は、制度名の下の［この制度の詳細］ボタンの中へ（宏史さん「全部読んで決めるのは決裁者の負荷。AIの判定で背中を押す」）
  ・2026-11-22-02：ボタンの中身と3ページ目以降が同じ情報に見えるため、ボタンを「この制度の簡易詳細」、3ページ目以降を「制度ごとの詳しいご案内」と呼び分け、簡易詳細の頭に詳しいご案内のページ番号を出す（宏史さんの指示）
  ・2026-11-22-03：「AIの判定」を「AIアドバイス判定」に改名。最初に結論（取る／検討／見送り）と札（作業が多い・期間が長い等）、続けて取りやすさ・書類の量・期間・御社の負担・戻る額を一目で、最後に理由を一言（宏史さんの指示「簡単にどうするかを決められるように」）
  ・2026-11-22-04：ご判断に「保留」「再検討」を追加（宏史さんの指示）。トライゲイト・トライタイムは印を go／stop／空でしか読まないため、保留・再検討は計画書の記録（triplan_decisions）だけで区別し、決裁の印（tg_kessai）は空＝「決裁待ち」として渡す
  ・2026-11-22-05：AIアドバイス判定の最後に「次の一手」（当社AIがやること／御社にお願いすること／いつまでに）を出す。理由は手間と見返りの比べ方で書く（宏史さん「検討ばかりでは何のために候補に出したか分からない。検討ならAIの作業と人間の作業を入れる」）
-->

<script>
function tsGoBack(){
  var b=document.getElementById("tsBackBar");
  if(b&&b.getAttribute("data-guard")==="1"){
    var typed=[].some.call(document.querySelectorAll("textarea,input[type=text],input:not([type])"),function(e){return e.value&&e.value.trim();});
    if(typed&&!confirm("この画面に入力した内容は保存されていません。前のページに戻ると消えます。戻りますか？"))return;
  }
  var r="";try{r=document.referrer?new URL(document.referrer).origin:"";}catch(e){}
  if(history.length>1&&r===location.origin){history.back();}else{location.href="index.html";}
}
/* 2026-11-06（宏史さんの指示）：前の画面が無いとき（タブレットのアイコンから直接開いたときなど）は、ボタン自体を出さない。
   トライサイトを契約していない人には表札へ行く道は要らないため */
(function(){
  var r="",rp="";try{if(document.referrer){var u=new URL(document.referrer);r=u.origin;rp=u.pathname;}}catch(e){}
  /* 自分自身を読み直したとき（前の画面が自分）も、前の画面が無いものとして扱う（戻るの判定と同じ） */
  if(!(history.length>1&&r===location.origin)||rp===location.pathname){var b=document.getElementById("tsBackBar");if(b)b.style.display="none";}
})();
</script>

<script>
(function(){

      '<p class="note">「進める」にした制度は、トライゲイトの「獲得スケジュール」に載り、書類をそろえ終える日・最終確認の日・入金の予想が出ます。金額は制度の上限・定額で、満額の受給を保証するものではありません。</p>' +
      '<p class="note">作成の前提：' + arr(P['前提']).map(esc).join('／') + '</p>', ++n);
    /* 2ページ目：時系列（2026-11-21-02・宏史さん「助成金や補助金毎に分けて。全部一つの助成金に見える」）＝制度ごとに見出しを立て、その中を月で区切る */
    var tl = G.map(function(g, k){
      var ev = arr(g['時系列']).slice().sort(function(a, b){ return String(a['時期']) < String(b['時期']) ? -1 : 1; });
      if(!ev.length) return '';
      var mm = {}; ev.forEach(function(t){ var m = String(t['時期'] || '').slice(0, 7); (mm[m] = mm[m] || []).push(t); });
      return '<div class="avoid" style="margin:0 0 10px"><h3 style="margin:8px 0 4px">' + (k + 1) + '. ' + esc(g['名称']) + '<span class="note">（' + esc(g['発出元'] || '') + '）</span></h3>' +
        '<table><tr><th style="width:14%">時期</th><th>やること</th></tr>' + Object.keys(mm).sort().map(function(m){
          return '<tr><td><b>' + esc(jm(m)) + '</b></td><td>' + mm[m].map(function(t){ return (t['入金'] ? '<span class="warn">【入金の予想】</span>' : '') + esc(t['内容'] || ''); }).join('<br>') + '</td></tr>';
        }).join('') + '</table></div>';
    }).join('');
    html += page('補助金・助成金 受給計画書　時系列',
      '<h2>2. いつ何をするか（制度ごとの予定）</h2>' + tl +
      '<p class="note warn">入金の時期は予想です。支給の時期は審査をする行政側で決まり、遅れることがあります。資金調達の1番目にはせず、別途、資金調達をお考えください。支給決定通知書が届いた後は、通知書の受領日から1か月以内を目安に入金の見込みを確定させます（当社の目安）。</p>', ++n);
    /* 3ページ目以降：制度ごと */
    G.forEach(function(g){
      var src = arr(g['出所']).map(function(s){ return esc(s['名'] || s) + (s['確認日'] ? '（' + esc(s['確認日']) + '確認）' : '') + (s['URL'] ? '<br><span class="note">' + esc(s['URL']) + '</span>' : ''); }).join('<br>');
      html += page('補助金・助成金 受給計画書　制度ごとの詳しいご案内',
        '<h2>' + esc(g['名称']) + '</h2><div class="note">' + esc(g['発出元'] || '') + '／' + esc(g['区分'] || '') + '</div>' +
        '<table class="avoid"><tr><th style="width:22%">目的・使い道</th><td>' + esc(g['使い道'] || '') + '</td></tr>' +
        '<tr><th>金額</th><td>' + esc(g['金額の説明'] || g['金額の見込み'] || '') + '</td></tr>' +
        '<tr><th>締切・受付</th><td>' + esc(g['受付の説明'] || g['締切表示'] || '') + '</td></tr>' +
        '<tr><th>御社の当てはまり</th><td>' + esc(g['御社の当てはまり'] || '') + '</td></tr>' +
        zairyo(g) +
        (g['AIアドバイス'] ? '<tr><th>AIアドバイス判定</th><td>' + aiCell(g) + '</td></tr>' : '') +
        '<tr><th>ご準備いただくこと</th><td><ul>' + arr(g['ご準備いただくこと']).map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></td></tr>' +
        '<tr><th>流れ</th><td><ul>' + arr(g['流れ']).map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></td></tr>' +
        '<tr><th>当社が受け持つこと</th><td>' + esc(g['当社の受け持ち'] || P['当社の受け持ち'] || '') + '</td></tr>' +
        '<tr><th>当社が受け持たないこと</th><td>' + esc(P['当社が受け持たないこと'] || '') + '</td></tr>' +
        '<tr><th>情報の出所</th><td class="note">' + src + '</td></tr></table>' +
        (g['注意'] ? '<div class="box warn">' + arr(g['注意']).map(esc).join('<br>') + '</div>' : ''), ++n);
    });
    /* 確認待ち・見送り・約束ごと */
    html += page('補助金・助成金 受給計画書　確認待ちと見送り',
      '<h2>確認待ちの事項（確かめれば取れるかどうかが決まるもの）</h2><table><tr><th style="width:34%">確認すること</th><th>分かると決まること</th><th style="width:20%">確認先</th></tr>' +
      arr(P['確認待ち']).map(function(c){ return '<tr class="avoid"><td>' + esc(c['項目']) + '</td><td>' + esc(c['決まること'] || '') + '</td><td>' + esc(c['確認先'] || '') + '</td></tr>'; }).join('') + '</table>' +
      '<h2>今回は見送る制度・次年度に回す制度</h2><table><tr><th style="width:34%">制度</th><th>理由</th><th style="width:20%">次の機会</th></tr>' +
      arr(P['見送り']).map(function(c){ return '<tr class="avoid"><td>' + esc(c['名称']) + '</td><td>' + esc(c['理由'] || '') + '</td><td>' + esc(c['次の機会'] || '') + '</td></tr>'; }).join('') + '</table>' +
      '<h2>お約束ごと</h2><ul>' + arr(P['約束ごと']).map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>', ++n);
    $('out').innerHTML = html;
  }

  $('out').addEventListener('click', function(ev){
    var b = ev.target; if(!b || !b.getAttribute || !P) return;
    var dt = b.getAttribute('data-dt'); if(dt != null){ OPEN[dt] = !OPEN[dt]; render(); return; }
    if(b.getAttribute('data-v') == null) return;
    var g = arr(P['制度']).filter(function(x){ return String(x.id) === b.getAttribute('data-id'); })[0];
    if(g) setDecision(g, b.getAttribute('data-v'));
  });
  $('file').addEventListener('change', function(){
    var f = this.files && this.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var d = JSON.parse(r.result);
        if(!d || !d['宛先'] || !d['宛先']['会社名'] || !Array.isArray(d['制度'])) throw new Error('受給計画データの形ではありません（宛先・制度がありません）');
        P = d; sj(KEY, d); render(); $('msg').textContent = '「' + f.name + '」を読み込みました。';
      }catch(e){ $('msg').textContent = '読み込めませんでした：' + e.message; }
    };
    r.readAsText(f, 'utf-8');
    this.value = '';
  });
  $('print').addEventListener('click', function(){ window.print(); });
  P = lj(KEY, null); render();
})();
</script>
</body>
</html>
