<!--
  TriPlan.html — 補助金・助成金 受給計画書（2026-11-21 新設・宏史さんの決定）
  ・決裁者が「どれを取るか」を決める材料。1ページ目＝一覧と判断欄／2ページ目＝時系列／以降＝制度ごとの詳細・確認待ち・見送り・約束ごと
  ・中身は「受給計画データ」（JSON）を読み込んで出す。会社の情報は公開の場所（GitHub）に置かない（基礎情報シートと同じ扱い）
  ・判断欄で「進める」にした制度は、そのまま獲得スケジュールに載せる（受け渡し箱 tritask_inbox に入れ、決裁の印 tg_kessai を go にする）
    宏史さんの判断（2026-11-21）「受給計画で決済が取れた最終的な助成金で獲得スケジュールを組んだ方が確実」
  ・全ページの頭と最終行に当社のマークを入れる（レターヘッドの決まり 2026-09-02・11-08）
  ・2026-11-21-02：A4横向きに変更（宏史さんの指示「シートを横書きに。幅が狭い」）。時系列を制度ごとに分けた
  ・2026-11-22-01：1ページ目の「支給の決まり方」の欄を「AIの判定（取るべきか）」に替えた。誰が行うか・時間と手間・費用・戻る額・御社の負担・支給の決まり方は、制度名の下の［この制度の詳細］ボタンの中へ（宏史さん「全部読んで決めるのは決裁者の負荷。AIの判定で背中を押す」）
  ・2026-11-22-02：ボタンの中身と3ページ目以降が同じ情報に見えるため、ボタンを「この制度の簡易詳細」、3ページ目以降を「制度ごとの詳しいご案内」と呼び分け、簡易詳細の頭に詳しいご案内のページ番号を出す（宏史さんの指示）
  ・2026-11-22-03：「AIの判定」を「AIアドバイス判定」に改名。最初に結論（取る／検討／見送り）と札（作業が多い・期間が長い等）、続けて取りやすさ・書類の量・期間・御社の負担・戻る額を一目で、最後に理由を一言（宏史さんの指示「簡単にどうするかを決められるように」）
  ・2026-11-22-04：ご判断に「保留」「再検討」を追加（宏史さんの指示）。トライゲイト・トライタイムは印を go／stop／空でしか読まないため、保留・再検討は計画書の記録（triplan_decisions）だけで区別し、決裁の印（tg_kessai）は空＝「決裁待ち」として渡す
  ・2026-11-22-05：AIアドバイス判定の最後に「次の一手」（当社AIがやること／御社にお願いすること／いつまでに）を出す。理由は手間と見返りの比べ方で書く（宏史さん「検討ばかりでは何のために候補に出したか分からない。検討ならAIの作業と人間の作業を入れる」）
  ・2026-11-22-06：「来期に取りにいく候補（今期の受付は終了）」のページを1ページ目の次に追加（計画データの『来期候補』）。AIアドバイス判定・ご判断の欄は今期と同じ。簡易詳細と詳しいご案内に『事前準備（いつ・何を・誰が）』を出す（宏史さん「締切が到来したため今期ではないが、来期に取るべきものはAI判断のもと情報提供し、事前準備にも言及する」）
  ・2026-11-22-07：「次の一手」は進めると決めた後の情報のため、判定の欄からは外し、「進める」を押した制度だけ判定の欄の下に出す。詳しいご案内には「進めた場合の役割分担」として常に載せる（宏史さん「次の一手は進めるの中の情報。前段では入れなくてよい」）
  ・2026-11-22-08：進めるを取り消す・見送る・保留・再検討に変えたとき、受け渡し箱のカードがまだ手付かず（未着手）なら取り除く。作業が始まっていれば残す
  ・2026-11-22-08：判断（進める等）を計画データの中（『判断』）にも書き込み、「判断を入れて保存する」でファイルに保存できるようにした。読み込むと、ファイルの判断どおりに受け渡し箱・決裁の印を整える。SSDの計画データが正本になり、どのPCでも同じ状態に戻る（宏史さん「全タクのコンサルはトライサイトの業務。トライサイトメインPCかラップトップで。情報はどこでも仕事ができるようSSD保管」）
  ・2026-11-22-08：判定の言い方は決めつけにしない（宏史さん「責任を取らないAIが決めつけで指示すると、失敗したとき『AIが言ったからやったのに』となる」）。見送りを勧めるものは候補に出さず、見送りの表へ
  ・2026-11-22-09：判定の札（お勧めします等）は出さない。取りにいく候補なのだから全部お勧めで、書く意味がない。代わりに「取るために整えること」（データの『整えること』）を欄の頭に出す（宏史さん「候補なのだから、条件を整える作業が何かを知りたいだけ」）
  ・2026-11-22-10：AIアドバイスの欄の一番下に「ひとことで：」として、取りやすさ・作業負荷・補助の大きさ・自己負担の大きさの札を出す（データの『評価』＝[{語, 良否: 良／注意／中}]）。良は緑、注意は黄、中は灰（宏史さん「枠の一番下に余裕があるので、取りやすい・作業負荷が多い・補助金が少ない・自己負担が大きいなどを入れられないか」）
  ・2026-11-22-11：「ひとことで」をAIアドバイスの欄から外し、左端の制度の欄（制度名・発出元・簡易詳細ボタンの下の余白）へ移した（宏史さん「ひとことでは制度の余白に。AIアドバイスが少し短くなる」）
  ・2026-11-22-16：一覧（今期・来期）のページを詰めて組み、1ページに2件ほど入るようにした。紙からはみ出す分は、頭と足の付いた次のページへ表の見出しごと送り、ページ番号を振り直す。印刷のときは開いている簡易詳細を閉じてから印刷する（宏史さん「3pと4pは紙がもったいない」「5pと6pは説明が途中で切れている」）
  ・2026-11-23-02：確認待ちと見送りのページも一覧と同じ詰めた組み方にして、確認待ちを1枚に収める。ページ送りで注記だけの紙ができるときは、前のページの最後の行を連れていく（宏史さん「5pは何？」「10pと11p、1pにして何か問題ありますか」）
  ・2026-11-23-01：ページ送りを確認待ち・見送りとお約束ごとにも広げた（2026-11-23-02でこの2ページも一覧と同じ組み方＝lst にしたため、ページ送りの対象は lst のページのまま）。ページ割りは印刷と同じ見た目（画面だけのボタンを隠した状態）で測り、紙の下端に約1cmの余裕を残す（端末の字体の差で、画面では収まっても紙ではみ出すため）（宏史さん「4pと5p」「10pと11pはちょん切れてる」）
  ・2026-11-22-15：「今回は見送る制度」と「お約束ごと」を、確認待ちの次のページに分けた（宏史さん「今回は見送る制度がちょん切れて見にくい」）
  ・2026-11-22-14：時系列と制度ごとの詳しいご案内は、「進める」に決まった制度だけ出す。判断前の計画書は、一覧（今期・来期）と確認待ちだけになる（宏史さん「取る取らないが決まってないのに必要ありますか」「取らないものの説明なんか読んでも意味がない」）
  ・2026-11-22-13：「取りにいく候補」「来期に取るべき」を「今期／来期に取りに行く予定の候補」に改めた。取るかどうかの判断は御社（宏史さん「とるという判断はあくまでも相模原交通側です。来期の分も同様です」）
  ・2026-11-22-12：「ひとことで」の頭に、AIのおすすめの印（◎イチオシ／○おすすめ／△条件が合えばおすすめ）と背中を押す一言を出す（データの『AIアドバイス.ひとこと』＝{印, 見出し, 文}）。札はその下に（宏史さん「ひとことコメントが刺さらない。AIのおすすめとかマーク付きで、取った方がいいよという感じを」）
-->

<script>
function tsGoBack(){
  var b=document.getElementById("tsBackBar");
  if(b&&b.getAttribute("data-guard")==="1"){
    var typed=[].some.call(document.querySelectorAll("textarea,input[type=text],input:not([type])"),function(e){return e.value&&e.value.trim();});
    if(typed&&!confirm("この画面に入力した内容は保存されていません。前のページに戻ると消えます。戻りますか？"))return;
  }
  var r="";try{r=document.referrer?new URL(document.referrer).origin:"";}catch(e){}
  if(history.length>1&&r===location.origin){history.back();}else{location.href="index.html";}
}
/* 2026-11-06（宏史さんの指示）：前の画面が無いとき（タブレットのアイコンから直接開いたときなど）は、ボタン自体を出さない。
   トライサイトを契約していない人には表札へ行く道は要らないため */
(function(){
  var r="",rp="";try{if(document.referrer){var u=new URL(document.referrer);r=u.origin;rp=u.pathname;}}catch(e){}
  /* 自分自身を読み直したとき（前の画面が自分）も、前の画面が無いものとして扱う（戻るの判定と同じ） */
  if(!(history.length>1&&r===location.origin)||rp===location.pathname){var b=document.getElementById("tsBackBar");if(b)b.style.display="none";}
})();
</script>

<script>
(function(){
  'use strict';
  var KEY = 'triplan_last', DKEY = 'triplan_decisions';
  function $(i){ return document.getElementById(i); }
  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function lj(k, d){ try{ var v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? d : v; }catch(e){ return d; } }
  function sj(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
  function arr(x){ return Array.isArray(x) ? x : (x == null || x === '' ? [] : [x]); }
  function jd(s){ var m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? (+m[1]) + '年' + (+m[2]) + '月' + (+m[3]) + '日' : String(s || ''); }
  function jm(s){ var m = String(s || '').match(/^(\d{4})-(\d{2})/); return m ? (+m[1]) + '年' + (+m[2]) + '月' : String(s || ''); }
  var P = null, OPEN = {};
  /* 判断材料（誰が・何を・時間と手間・費用・戻る額・御社の負担）＋支給の決まり方を一番下に */
  function zairyo(g){
    var z = g['判断材料'] || {}, L = [['誰が行うか','誰が'],['何をするか','何をするか'],['時間・手間','時間・手間'],['かかる費用','費用'],['戻ってくる額（補助・助成）','戻る額'],['御社の実際の負担','御社の負担']];
    return L.filter(function(x){ return z[x[1]]; }).map(function(x){ return '<tr><th>' + x[0] + '</th><td>' + esc(z[x[1]]) + '</td></tr>'; }).join('') +
      (g['支給の決まり方'] ? '<tr><th>支給の決まり方</th><td>' + esc(g['支給の決まり方']) + '</td></tr>' : '') + junbi(g);
  }
  /* 来期の候補の事前準備（2026-11-22-06）＝いつ・何を・誰が */
  function junbi(g){
    var j = arr(g['事前準備']); if(!j.length) return '';
    return '<tr><th>事前準備（来期に向けて）</th><td><table><tr><th style="width:20%">いつ</th><th>何を</th><th style="width:16%">誰が</th></tr>' +
      j.map(function(x){ return '<tr><td>' + esc(x['時期'] || '') + '</td><td>' + esc(x['内容'] || '') + '</td><td>' + esc(x['誰が'] || '') + '</td></tr>'; }).join('') + '</table></td></tr>';
  }
  /* AIアドバイス判定（2026-11-22-03）：結論→札→一目の項目→理由の順 */
  function nextStep(g, title){
    var n = (g['AIアドバイス'] || {})['次の一手']; if(!n) return '';
    return '<div class="nx"><b>' + esc(title) + '</b>' +
      (arr(n['当社AI']).length ? '<div>当社AIがやること：' + arr(n['当社AI']).map(esc).join('／') + '</div>' : '') +
      (arr(n['御社']).length ? '<div>御社にお願いすること：' + arr(n['御社']).map(esc).join('／') + '</div>' : '') +

    var dt = b.getAttribute('data-dt'); if(dt != null){ OPEN[dt] = !OPEN[dt]; render(); return; }
    if(b.getAttribute('data-v') == null) return;
    var g = arr(P['制度']).concat(arr(P['来期候補'])).filter(function(x){ return String(x.id) === b.getAttribute('data-id'); })[0];
    if(g) setDecision(g, b.getAttribute('data-v'));
  });
  $('file').addEventListener('change', function(){
    var f = this.files && this.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var d = JSON.parse(r.result);
        if(!d || !d['宛先'] || !d['宛先']['会社名'] || !Array.isArray(d['制度'])) throw new Error('受給計画データの形ではありません（宛先・制度がありません）');
        P = d; sj(KEY, d);
        /* ファイルに書かれた判断どおりに、受け渡し箱と決裁の印を整える */
        var J = (d['判断'] && typeof d['判断'] === 'object') ? d['判断'] : {}, cnt = 0;
        var old = decs()[d['宛先']['会社名']] || {};
        arr(d['制度']).concat(arr(d['来期候補'])).forEach(function(g){
          if(J[g.id]){ setDecision(g, J[g.id], true); cnt++; }
          else if(old[g.id]){ setDecision(g, '', true); }  /* ファイルが正本：ファイルに無い判断は外す */
        });
        render(); $('msg').textContent = '「' + f.name + '」を読み込みました。' + (cnt ? 'ファイルに書かれた判断' + cnt + '件を反映しました。' : '');
      }catch(e){ $('msg').textContent = '読み込めませんでした：' + e.message; }
    };
    r.readAsText(f, 'utf-8');
    this.value = '';
  });
  $('save').addEventListener('click', function(){
    if(!P){ $('msg').textContent = '先に受給計画データを読み込んでください。'; return; }
    var name = String(P['宛先']['会社名']).replace(/[\\/:*?"<>|\s]/g, '').replace(/^株式会社|株式会社$/g, '') + '_受給計画.json';
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(P, null, 1)], {type:'application/json'})); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    $('msg').textContent = '「' + name + '」を保存しました。ダウンロードのフォルダから、SSDの同じ名前のファイルに上書きしてください。';
  });
  $('print').addEventListener('click', function(){ var k; for(k in OPEN){ if(OPEN[k]){ OPEN = {}; render(); break; } } window.print(); });
  P = lj(KEY, null); render();
})();
</script>
