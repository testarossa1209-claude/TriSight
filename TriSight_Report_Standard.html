<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriSight™ Report Standard</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=Cormorant+Garamond:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0d1b2a;
      --navy-mid: #152638;
      --navy-light: #1e3a52;
      --gold: #c9a84c;
      --gold-light: #e8c96a;
      --cream: #f5f0e8;
      --cream-dark: #ede6d8;
      --border: rgba(201,168,76,0.3);
      --text: #f5f0e8;
      --text-muted: #9aabb8;
      --red: #e05555;
      --green: #4caf82;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--navy);
      color: var(--text);
      font-family: 'Zen Kaku Gothic New', sans-serif;
      min-height: 100vh;
    }

    /* ─── HEADER ─── */
    .header {
      background: linear-gradient(135deg, #0a1520 0%, var(--navy-mid) 100%);
      border-bottom: 1px solid var(--border);
      padding: 24px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .logo-mark {
      width: 48px; height: 48px;
      border: 2px solid var(--gold);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      color: var(--gold);
      font-weight: 600;
    }
    .header-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      color: var(--gold);
      letter-spacing: 0.08em;
    }
    .header-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.15em;
      margin-top: 2px;
    }
    .header-badge {
      font-size: 0.7rem;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: 0.1em;
    }

    /* ─── MAIN LAYOUT ─── */
    .main { max-width: 900px; margin: 0 auto; padding: 40px 24px; }

    /* ─── INPUT SECTION ─── */
    .input-section {
      background: var(--navy-mid);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 28px;
      margin-bottom: 32px;
    }
    .section-label {
      font-size: 0.72rem;
      color: var(--gold);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .input-section p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.7;
    }
    textarea {
      width: 100%;
      min-height: 200px;
      background: var(--navy);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-size: 0.85rem;
      padding: 16px;
      resize: vertical;
      line-height: 1.8;
      outline: none;
      transition: border-color 0.3s;
    }
    textarea:focus { border-color: var(--gold); }
    textarea::placeholder { color: #3a5068; }

    .btn-row {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .btn-primary {
      background: var(--gold);
      color: var(--navy);
      border: none;
      padding: 12px 32px;
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Zen Kaku Gothic New', sans-serif;
      letter-spacing: 0.05em;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-primary:hover { background: var(--gold-light); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-secondary {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 12px 24px;
      font-size: 0.85rem;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Zen Kaku Gothic New', sans-serif;
      transition: color 0.2s, border-color 0.2s;
    }
    .btn-secondary:hover { color: var(--text); border-color: var(--gold); }

    /* ─── REPORT OUTPUT ─── */
    #report { display: none; }

    .report-header {
      background: linear-gradient(135deg, #0a1520 0%, var(--navy-mid) 100%);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 36px;
      margin-bottom: 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .report-header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .report-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      color: var(--gold);
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }
    .report-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
    }

    .ai-section {
      background: var(--navy-mid);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .ai-section-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(201,168,76,0.05);
    }
    .ai-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-weight: 600;
      flex-shrink: 0;
    }
    .ai-avatar.azusa { background: rgba(100,160,255,0.15); color: #64a0ff; border: 1px solid rgba(100,160,255,0.3); }
    .ai-avatar.nagisa { background: rgba(201,168,76,0.15); color: var(--gold); border: 1px solid var(--border); }
    .ai-avatar.tsukasa { background: rgba(76,175,130,0.15); color: var(--green); border: 1px solid rgba(76,175,130,0.3); }
    .ai-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem;
      color: var(--text);
      letter-spacing: 0.05em;
    }
    .ai-role {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      margin-top: 2px;
    }
    .ai-badge {
      margin-left: auto;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      padding: 3px 10px;
      border-radius: 12px;
    }
    .ai-badge.azusa { background: rgba(100,160,255,0.1); color: #64a0ff; border: 1px solid rgba(100,160,255,0.2); }
    .ai-badge.nagisa { background: rgba(201,168,76,0.1); color: var(--gold); border: 1px solid var(--border); }
    .ai-badge.tsukasa { background: rgba(76,175,130,0.1); color: var(--green); border: 1px solid rgba(76,175,130,0.2); }

    .ai-content {
      padding: 24px;
      font-size: 0.88rem;
      line-height: 1.9;
      color: #cdd8e0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .ai-content.empty {
      color: #3a5068;
      font-style: italic;
    }

    /* ─── EXPORT BAR ─── */
    .export-bar {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .btn-export {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 10px 20px;
      font-size: 0.82rem;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Zen Kaku Gothic New', sans-serif;
      transition: all 0.2s;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-export:hover { border-color: var(--gold); color: var(--gold); }
    .btn-export.primary-export {
      background: var(--gold);
      color: var(--navy);
      border-color: var(--gold);
      font-weight: 700;
    }
    .btn-export.primary-export:hover { background: var(--gold-light); }

    /* ─── EMPTY STATE ─── */
    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-muted);
    }
    .empty-icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.4; }
    .empty-state h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; color: var(--text-muted); margin-bottom: 8px; }
    .empty-state p { font-size: 0.82rem; }

    @media print {
      .input-section, .export-bar, .header { display: none; }
      body { background: white; color: #111; }
      .ai-section { border: 1px solid #ccc; page-break-inside: avoid; }
      .report-header { background: white; }
      .report-title { color: #8a6820; }
      .ai-content { color: #333; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo-mark"><img src="TriSight_icon_512.png" style="width:40px;height:40px;border-radius:50%;object-fit:cover;"></div>
    <div>
      <div class="header-title">TriSight™ Report Standard</div>
      <div class="header-sub">THREE-BODY INTEGRATED AI OUTPUT FORMATTER</div>
    </div>
  </div>
  <div class="header-badge">Ver 1.0</div>
</div>

<div class="main">

  <!-- INPUT -->
  <div class="input-section">
    <div class="section-label">▸ TXT出力を貼り付け</div>
    <p>TriSight™ワークフローで生成したTXTファイルの内容をそのまま貼り付けてください。自動的に三者の出力を分離・整形します。</p>
    <textarea id="txtInput" placeholder="■TriSight™ 出力レポート&#10;生成日時：...&#10;&#10;【あずさ 出力】&#10;...&#10;&#10;【なぎさ 出力】&#10;...&#10;&#10;【つかさ 出力】&#10;..."></textarea>
    <div class="btn-row">
      <button class="btn-primary" onclick="generateReport()">📊 レポートを生成</button>
      <button class="btn-secondary" onclick="clearAll()">クリア</button>
    </div>
  </div>

  <!-- REPORT -->
  <div id="report">
    <div class="report-header">
      <div class="report-title">TriSight™ 統合出力レポート</div>
      <div class="report-meta" id="reportMeta"></div>
    </div>

    <div class="ai-section">
      <div class="ai-section-header">
        <div class="ai-avatar azusa">あ</div>
        <div>
          <div class="ai-name">あずさ</div>
          <div class="ai-role">構想担当 — 自由な発想で理論化・展開</div>
        </div>
        <span class="ai-badge azusa">THEORY AI-1</span>
      </div>
      <div class="ai-content" id="outAzusa"></div>
    </div>

    <div class="ai-section">
      <div class="ai-section-header">
        <div class="ai-avatar nagisa">な</div>
        <div>
          <div class="ai-name">なぎさ</div>
          <div class="ai-role">検証担当 — 懸念点を抽出・理論補強</div>
        </div>
        <span class="ai-badge nagisa">THEORY AI-2</span>
      </div>
      <div class="ai-content" id="outNagisa"></div>
    </div>

    <div class="ai-section">
      <div class="ai-section-header">
        <div class="ai-avatar tsukasa">つ</div>
        <div>
          <div class="ai-name">つかさ</div>
          <div class="ai-role">評価担当 — 妥当性・実現可能性・改善点を判定</div>
        </div>
        <span class="ai-badge tsukasa">EVALUATOR AI</span>
      </div>
      <div class="ai-content" id="outTsukasa"></div>
    </div>

    <div class="export-bar">
      <button class="btn-export" onclick="window.print()">🖨 印刷 / PDF保存</button>
      <button class="btn-export primary-export" onclick="downloadTXT()">📄 TXT再出力</button>
    </div>
  </div>

</div>

<script>
function generateReport() {
  var raw = document.getElementById('txtInput').value.trim();
  if (!raw) {
    alert('TXTの内容を貼り付けてください。');
    return;
  }

  // 日時抽出
  var dateMatch = raw.match(/生成日時[：:]\s*(.+)/);
  var dateStr = dateMatch ? dateMatch[1].trim() : '日時不明';
  document.getElementById('reportMeta').textContent = '生成日時：' + dateStr;

  // 各AIの出力を抽出
  var azusa = extractSection(raw, '【あずさ 出力】', '【なぎさ 出力】');
  var nagisa = extractSection(raw, '【なぎさ 出力】', '【つかさ 出力】');
  var tsukasa = extractSection(raw, '【つかさ 出力】', null);

  setContent('outAzusa', azusa);
  setContent('outNagisa', nagisa);
  setContent('outTsukasa', tsukasa);

  document.getElementById('report').style.display = 'block';
  document.getElementById('report').scrollIntoView({ behavior: 'smooth' });
}

function extractSection(text, startTag, endTag) {
  var start = text.indexOf(startTag);
  if (start === -1) return '';
  start += startTag.length;
  var end = endTag ? text.indexOf(endTag) : text.length;
  if (end === -1) end = text.length;
  return text.substring(start, end).trim();
}

function setContent(id, text) {
  var el = document.getElementById(id);
  if (!text) {
    el.textContent = '（出力なし）';
    el.classList.add('empty');
  } else {
    el.textContent = text;
    el.classList.remove('empty');
  }
}

function clearAll() {
  document.getElementById('txtInput').value = '';
  document.getElementById('report').style.display = 'none';
}

// v5.htmlからの自動流し込み
window.addEventListener('DOMContentLoaded', function() {
  var saved = localStorage.getItem('trisight_output');
  if (saved) {
    document.getElementById('txtInput').value = saved;
    localStorage.removeItem('trisight_output');
    generateReport();
  }
});

function downloadTXT() {
  var azusa = document.getElementById('outAzusa').textContent;
  var nagisa = document.getElementById('outNagisa').textContent;
  var tsukasa = document.getElementById('outTsukasa').textContent;
  var meta = document.getElementById('reportMeta').textContent;
  var content = '■TriSight™ 統合出力レポート\n' + meta + '\n\n【あずさ 出力】\n' + azusa + '\n\n【なぎさ 出力】\n' + nagisa + '\n\n【つかさ 出力】\n' + tsukasa;
  var blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'TriSight_Report_' + new Date().toISOString().slice(0,10) + '.txt';
  a.click();
}
</script>
</body>
</html>
