     TriTalk（トライトーク）＝ 秘書（あずさ・なぎさ・つかさ）と自由に話す画面の製品版（2026-11-26 宏史さんの決定）

     ・製品版で足したもの：
         ① 独立した画面（表札から直接入れる）
         ② 「みんな」＝ 一つの問いに あずさ→なぎさ→つかさ の順で、それぞれの立場から答える（前の人の話を受けて重ねない）

         ④ 読み上げを途中で止める・声を出さず文字だけにする切り替え
         ⑤ 「ほかの秘書も意見を出す」＝ 指名した秘書が答えたあと、残りの2人がその答えを聞いたうえで「（自分の名前）はこのように考えます」と人間に向けて別の提案を出す。
            秘書どうしの意見交換ではなく一方通行：後の秘書は前の秘書の答えを聞いたうえで、人間に向けて自分の意見を言う（前の秘書には話しかけない）。

         ⑥ 名前での指名は TriSecretaries.js の takeName（呼びかけ・敬称・表記揺れ）。「みんな」も同じ呼びかけを受ける

<script>
function tsGoBack(){
  var b=document.getElementById("tsBackBar");
  if(b&&b.getAttribute("data-guard")==="1"){
    var typed=[].some.call(document.querySelectorAll("textarea,input[type=text],input:not([type])"),function(e){return e.value&&e.value.trim();});
    if(typed&&!confirm("この画面に入力した内容は保存されていません。前のページに戻ると消えます。戻りますか？"))return;
  }
  var r="";try{r=document.referrer?new URL(document.referrer).origin:"";}catch(e){}
  if(history.length>1&&r===location.origin){history.back();}else{location.href="index.html";}
}
/* 2026-11-06（宏史さんの指示）：前の画面が無いとき（タブレットのアイコンから直接開いたときなど）は、ボタン自体を出さない。
   トライサイトを契約していない人には表札へ行く道は要らないため */
(function(){
  var r="",rp="";try{if(document.referrer){var u=new URL(document.referrer);r=u.origin;rp=u.pathname;}}catch(e){}
  /* 自分自身を読み直したとき（前の画面が自分）も、前の画面が無いものとして扱う（戻るの判定と同じ） */
  if(!(history.length>1&&r===location.origin)||rp===location.pathname){var b=document.getElementById("tsBackBar");if(b)b.style.display="none";}
})();

<script>
(function(){
  'use strict';
  var T = window.TriSecretaries, SEC = T.SEC, ORDER = T.ORDER;
  var KEY = 'tritalk_convs_v1', MAX_CONVS = 30;
  var ALL = { name:'みんな', role:'三方向', tag:'一つの問いに、あずさ→なぎさ→つかさの順で答えます' };
  var cur = 'nagisa', talking = false, busy = false, audio = null, hushed = false;
  var store = load(), conv = null;
  var $ = function(id){ return document.getElementById(id); };

  /* ---- 保存（この端末の localStorage だけ） ---- */
  function load(){ try{ var o = JSON.parse(localStorage.getItem(KEY) || 'null'); if(o && Array.isArray(o.convs)) return o; }catch(e){} return { convs: [] }; }
  function save(){
    store.convs = store.convs.filter(function(c){ return c.items.length; }).slice(0, MAX_CONVS);
    for(var n = 0; n < 5; n++){
      try{ localStorage.setItem(KEY, JSON.stringify(store)); return; }
      catch(e){ if(store.convs.length > 1) store.convs.pop(); else { status('この端末の保存領域がいっぱいで、会話を残せませんでした。TXTで書き出してください。', true); return; } }
    }
  }
  function newConv(){ conv = { id: String(Date.now()), at: Date.now(), title: '', items: [] }; return conv; }
  function stamp(t){ var d = new Date(t); return (d.getMonth()+1) + '/' + d.getDate() + ' ' + ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2); }
  function fillPast(){
    var sel = $('past'); sel.innerHTML = '<option value="">過去の会話を開く（' + store.convs.length + '件）</option>';
    store.convs.forEach(function(c){ var o = document.createElement('option'); o.value = c.id; o.textContent = stamp(c.at) + '　' + (c.title || '（題名なし）'); if(conv && c.id === conv.id) o.textContent += '（表示中）'; sel.appendChild(o); });
  }
  function record(w, text){
    if(!conv.items.length){ conv.title = text.replace(/\s+/g, ' ').slice(0, 24); store.convs.unshift(conv); }
    conv.items.push({ w: w, t: text, at: Date.now() }); save(); fillPast();
  }

  /* ---- 表示 ---- */
  function status(t, warn){ $('st').textContent = t || ''; $('st').className = (warn || /失敗|できません|未対応|合いません|まだ用意|いっぱい/.test(t || '')) ? 'warn' : ''; }
  function label(w){ return SEC[w].name + '（' + SEC[w].role + '）'; }
  function hint(){ $('log').innerHTML = '<div class="hint">話したい秘書を上から選んで、赤い「🎙 話しかける」を押してください。話し終えると自動で送ります。<br>話の頭で名前を呼んでも選べます（例「つかさ、〜」「ねえ、なぎさ、〜」「みんな、〜」）。文字で送ることもできます。<br>ほかの秘書の意見もほしいときは、上の「ほかの秘書も意見を出す」にチェックを入れてください。指名した秘書が答えたあと、残りの秘書もあなたへ別の提案を出します。<br>一つの見方に偏らず、三つの方向から考える。答えを決めるのは人間です。</div>'; }
  function bubble(w, text){
    var h = document.querySelector('#log .hint'); if(h) h.remove();
    var d = document.createElement('div'); d.className = 'msg ' + (w === 'me' ? 'me' : 'ai');
    if(w !== 'me'){ var b = document.createElement('b'); b.textContent = label(w); d.appendChild(b); }
    d.appendChild(document.createTextNode(text)); $('log').appendChild(d); $('log').scrollTop = $('log').scrollHeight;
  }
  function render(){ $('log').innerHTML = ''; if(!conv.items.length) return hint(); conv.items.forEach(function(it){ bubble(it.w, it.t); }); }
  ORDER.concat(['all']).forEach(function(k){
    var s = k === 'all' ? ALL : SEC[k];
    var b = document.createElement('button'); b.type = 'button'; b.className = 'sec'; b.id = 'sec_' + k;
    b.innerHTML = '<span class="nm">' + s.name + '</span><span class="rl">' + s.role + '</span><div class="tg">' + s.tag + '</div>';
    b.addEventListener('click', function(){ pick(k); });
    $('secs').appendChild(b);
  });
  function pick(k){ cur = k; ORDER.concat(['all']).forEach(function(x){ $('sec_' + x).classList.toggle('on', x === k); }); }

  /* ---- 秘書へ渡す履歴：自分の話は assistant、他の秘書の話は［名前の発言］付きで user として渡す ---- */
  function historyFor(k){
    return conv.items.map(function(it){
      if(it.w === 'me') return { role:'user', content: it.t };
      if(it.w === k) return { role:'assistant', content: it.t };
      return { role:'user', content: '［' + label(it.w) + 'の発言］' + it.t };
    });
  }
  var EXTRA_BASE = 'この画面では、あずさ・なぎさ・つかさの三人の秘書が同じ会話に加わります。他の秘書の発言は［名前の発言］の見出し付きで届きます。返答には［ ］の見出しを付けず、そのまま話してください。';
  /* やり取りはあくまでAIと人間（2026-11-26 宏史さん「意見交換ではありません」「一方通行」）。
     後の秘書は前の秘書の答えを聞いたうえで、人間に向けて自分の意見を言う。前の秘書に話しかけたり、やり取りしたりはしない */
  function EXTRA_CHIME(first, me){ var SEC_NAME_PH = SEC[me].name; return '今は' + label(first) + 'が相手（人間）の問いに答えたところです。あなたは' + SEC[first].name + 'の答えを聞いたうえで、自分の担当の立場から、相手（人間）に向けて「' + SEC_NAME_PH + 'はこのように考えます」と切り出して、自分の意見や提案を短く言ってください。' + SEC[first].name + 'の答えに触れるときは「' + SEC[first].name + 'の案を踏まえると、私は〜と考えます」のように人間への説明として触れ、' + SEC[first].name + 'や他の秘書に話しかけたり、言い返したりはしないでください（秘書どうしの意見交換ではなく、話す相手は人間だけの一方通行です）。他の秘書が言ったことの繰り返しや言い換えはしないでください。本当に付け加える意見が無いときは「パス」とだけ答えてください。'; }
  var PASS = /^[\s　「」]*パス[。.！!]?[\s　」]*$/;
  var EXTRA_ALL = '今回は「みんな」への問いかけで、あずさ→なぎさ→つかさの順に一人ずつ答えます。前の秘書が言ったことを繰り返さず、自分の担当の立場からだけ短く付け加えてください。';

  /* ---- 声：読み上げ向けに記号を落とす。Googleの声が公開用の経路（Vertex AI）以外で作られたときは知らせる ---- */
  function forSpeech(t){ return String(t).replace(/https?:\/\/\S+/g, '').replace(/[#＃*＊`>|]/g, '').replace(/^\s*[-・]\s*/gm, '').trim(); }
  function play(text, k){
    if(!$('voiceOn').checked || hushed || typeof TriVoice === 'undefined' || !TriVoice.synth) return Promise.resolve();
    return TriVoice.synth(forSpeech(text), SEC[k].voice).then(function(o){
      if(hushed) return;
      if(SEC[k].voice.vendor === 'google' && o.route !== 'vertex') status('ご注意：' + SEC[k].name + 'の声は評価用の経路で作られています（公開の場では Vertex AI の設定が必要です）。', true);
      return new Promise(function(res){
        var url = URL.createObjectURL(o.blob); audio = new Audio(url); $('hush').classList.add('show');
        audio.onended = audio.onerror = function(){ URL.revokeObjectURL(url); audio = null; $('hush').classList.remove('show'); res(); };
        audio.play().catch(function(){ audio = null; $('hush').classList.remove('show'); res(); });
        audio._done = res;
      });
    });
  }
  function hush(){
    hushed = true;
    if(audio){ var a = audio, r = a._done; audio = null; try{ a.pause(); }catch(e){} $('hush').classList.remove('show'); if(r) r(); }
  }

  /* ---- 一人の秘書に答えてもらう ---- */
  async function one(k, extra, allowPass){
    $('sec_' + k).classList.add('talk'); status(SEC[k].name + 'が考えています…');
    var reply;
    try{ reply = await T.ask(k, historyFor(k), { extra: extra }); }
    catch(e){ $('sec_' + k).classList.remove('talk'); status(SEC[k].name + 'の返答を得られませんでした：' + e.message, true); return false; }
    if(allowPass && PASS.test(reply)){ $('sec_' + k).classList.remove('talk'); status(SEC[k].name + 'は付け加えることがありません。'); return true; }
    record(k, reply); bubble(k, reply);
    var warned = /ご注意/.test($('st').textContent);
    if(!warned) status($('voiceOn').checked && !hushed ? SEC[k].name + 'が話しています…' : '');
    try{ await play(reply, k); if(!/ご注意/.test($('st').textContent)) status(''); }
    catch(e){ status('声にできませんでした（文字で返答しています）：' + e.message, true); }
    $('sec_' + k).classList.remove('talk');
    return true;
  }
  /* 「みんな、〜」で3人に聞く。後ろに助詞が続くとき（「みんなに聞きたい」）は指名だけして文は残す。「皆様」等は呼びかけにしない */
  var ALL_CALL = /^(?:みんな|皆さん|みなさん|全員)(?:さん)?(?![様])[、,，。\s　]*/, ALL_PART = /^(?:みんな|皆さん|みなさん|全員)(?=[にはがのもをとへやっ])/;
  async function handle(raw){
    raw = String(raw || '').trim(); if(!raw) return next();
    var ld = raw.match(T.LEAD), body = ld ? raw.slice(ld[0].length) : raw;
    var m = body.match(ALL_CALL), text = raw;
    if(m){ pick('all'); text = ALL_PART.test(body) ? body : body.slice(m[0].length).trim(); }
    else { var tn = T.takeName(raw); if(tn.who) pick(tn.who); text = tn.text; }
    if(!text){ status((cur === 'all' ? ALL.name : SEC[cur].name) + 'に替えました。続けてどうぞ。'); return next(); }
    busy = true; hushed = false; $('send').disabled = true;
    record('me', text); bubble('me', text);
    if(cur === 'all'){
      for(var i = 0; i < ORDER.length; i++) await one(ORDER[i], EXTRA_BASE + EXTRA_ALL);   /* 一人が答えられなくても、残りの人は答える */
    } else {
      var first = cur, ok = await one(first, EXTRA_BASE);
      if(ok && $('chimeOn').checked){
        for(var j = 0; j < ORDER.length; j++){ if(ORDER[j] !== first) await one(ORDER[j], EXTRA_BASE + EXTRA_CHIME(first, ORDER[j]), true); }
      }
    }
    busy = false; $('send').disabled = false; next();
  }

  /* ---- 声の会話：話の区切りで自動送信し、答え終わると自動でまた聞く ---- */
  function next(){
    if(!talking || busy) return;
    TriVoice.listen({ status: function(t){ if(t) status(t); },
      listeningMessage: (cur === 'all' ? '三人' : SEC[cur].name) + 'が聞いています。話し終えると自動で送ります。',
      onText: function(t){ handle(t); },
      onEnd: function(why){ if(why === 'nospeech' || why === 'noise'){ if(talking) next(); return; } stop(); } });
  }
  function start(){
    if(typeof TriVoice === 'undefined' || !TriVoice.listen){ status('音声エンジンが読み込めません（文字で入力してください）。', true); return; }
    talking = true; $('talk').classList.add('on'); $('talk').textContent = '■ 会話を終える'; next();
  }
  function stop(){
    talking = false; $('talk').classList.remove('on'); $('talk').textContent = '🎙 話しかける';
    try{ TriVoice.stopListen(); }catch(e){} hush();
    if(!busy) status('');
  }
  $('talk').addEventListener('click', function(){ talking ? stop() : start(); });
  $('hush').addEventListener('click', hush);
  function sendTyped(){ var v = $('txt').value.trim(); if(!v || busy) return; $('txt').value = ''; handle(v); }
  $('send').addEventListener('click', sendTyped);
  $('txt').addEventListener('keydown', function(e){ if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); sendTyped(); } });

  /* ---- 会話の切り替え・書き出し・印刷 ---- */
  $('newConv').addEventListener('click', function(){ if(busy) return; stop(); newConv(); render(); fillPast(); status('新しい会話を始めました。'); });
  $('past').addEventListener('change', function(){
    var id = this.value; if(!id || busy){ this.value = ''; return; }
    var c = store.convs.filter(function(x){ return x.id === id; })[0];
    if(c){ stop(); conv = c; render(); status(stamp(c.at) + 'の会話を開きました。このまま続けて話せます。'); }
    fillPast(); this.value = '';
  });
  function text(){
    var L = ['TriTalk（トライトーク）　会話の記録', '合同会社トライサイト　TriSight®', '始めた日時：' + new Date(conv.at).toLocaleString('ja-JP'), ''];
    conv.items.forEach(function(it){ L.push('■ ' + (it.w === 'me' ? 'あなた' : label(it.w)) + '　' + stamp(it.at)); L.push(it.t); L.push(''); });
    return L.join('\r\n');
  }
  $('saveTxt').addEventListener('click', function(){
    if(!conv.items.length){ status('まだ会話がありません。'); return; }
    var d = new Date(conv.at), name = 'トライトーク_会話_' + d.getFullYear() + ('0'+(d.getMonth()+1)).slice(-2) + ('0'+d.getDate()).slice(-2) + '_' + ('0'+d.getHours()).slice(-2) + ('0'+d.getMinutes()).slice(-2) + '.txt';
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + text()], { type:'text/plain;charset=utf-8' })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    status('「' + name + '」をダウンロードフォルダに書き出しました。');
  });
  $('printBtn').addEventListener('click', function(){
    if(!conv.items.length){ status('まだ会話がありません。'); return; }
    $('prDate').textContent = '会話の日時：' + new Date(conv.at).toLocaleString('ja-JP'); window.print();
  });
  window.addEventListener('beforeprint', function(){ try{ TriVoice.stop(); }catch(e){} });

  /* ---- 始め：前回の会話の続きを開く（無ければ新しく） ---- */
  conv = store.convs[0] || newConv();
  pick(cur); render(); fillPast();
  window.TriTalk = { _handle: handle, _store: function(){ return store; }, _historyFor: historyFor, version: '2026-11-26-01' };
})();
</script>
</body>
